; HF Blade settings. Edited by hfblade-launcher.exe or by hand.
[General]
; 0 disables all patches (the proxy still forwards DirectInput).
Enabled=1
; Target frame rate during gameplay. 60..240. Presets: 60, 90, 120, 144, 165.
; hfblade-launcher.exe and the PresetKey both change this value.
TargetFPS=120
; Frame rate for scenes the game runs in its 30 fps mode (menus etc.).
; 0 = same as TargetFPS, 30 = original, otherwise 30..240.
MenuFPS=0
; Title screen ("press start") frame rate cap. 0 = same as MenuFPS (default); 30 = original game.
; 0 = use MenuFPS.
TitleFPS=0
; Virtual-key code that switches between HFR and the original 60/30 fps at runtime.
; Decimal value: 120 = F9 (0x78), 119 = F8, 121 = F10. 0 disables the hotkey.
ToggleKey=120
; Virtual-key code that switches TargetFPS to the next preset in game and saves it here.
; 119 = F8. 0 disables it.
PresetKey=119
; Every 600 frames, write fps / multiplier info to hfblade.log.
LogStats=1
; Diagnostic: once per second while buttons are pressed, log pad-0 press counts.
LogInput=0
; 0 turns off only the frame-rate patches (display patches still apply).
HighFrameRate=1

[Fixes]
; Scales button-mash QTE gauges and their frame-counted timeouts by real time.
QteFix=1
; How much of the original mash-gauge decay to keep at high fps, in percent (10..100).
; 100 = exactly as hard as 60 fps; lower = easier. Has no effect when F9 switches to 60 fps.
QteEase=60
; Keeps Blade Mode / synced animations and the slow-motion ramp at real-time speed.
BladeModeFix=1
; Particle effects (blood, sparks, smoke) age at real-time speed above 60 fps.
EffectTimingFix=1

[Display]
; The game's "1920x1080" option is rendered at Width x Height with no black bars, e.g. 1920x1200
; (16:10), 2560x1080 / 3440x1440 (21:9) or 5120x1440 (32:9). Height = 0 leaves the game unchanged.
; Use fullscreen. The menu label still says 1920x1080. Older configs used Height1920 (width 1920).
Width=1920
Height=1200
; 1 = aspect-correct FOV: taller than 16:9 gets more vertical view (Vert+), wider keeps the game's
; Hor+, and the 3D HUD layer is sized for the real height. 0 = leave the FOV alone.
VertPlusFov=1

[Debris]
; Keep the pieces of the last N cuts (enemy parts and objects) instead of letting them explode
; and disappear. Older cuts are cleaned up as usual when a newer cut pushes them out.
; 0 = game default, 1..8.
KeepLastCuts=2
; Keep the bodies of the last N killed enemies instead of letting them explode and vanish.
; Covers the common cyborg soldiers (Em0010) and Em0030 so far. 0 = game default, 1..8.
KeepCorpses=3
; 1 = log each cut event, its debris groups and releases to hfblade.log (diagnostic).
LogDebris=0

[Launcher]
; Opening animation: 0 = off, 1 = single cut (classic), 2 = flurry of cuts, then one big cut.
Intro=2
; Cut sound effects (files in hfblade-sounds\). 0 = muted. The speaker button toggles it.
Sound=1

[PhotoMode]
; F10 in game: freeze the world, hide the HUD and fly a free camera. Press it again to resume.
Enabled=1
; Virtual-key code of the toggle key. 121 = F10.
Key=121
; Free-camera speed in cm per second (Shift = x4, Alt = x0.25).
SpeedCmPerSec=400
; 1 = pause the game's sound effects, voices, ambience and music while in photo mode.
PauseAudio=1

[WeaponSwitch]
; One button cycles the unique (heavy attack) weapon through the ones you own, without the menu.
Enabled=1
; XInput button mask: 2 = D-pad down, 1 = up, 4 = left, 8 = right, 0x40 = L3, 0x80 = R3.
PadButton=2
; Optional keyboard key (virtual-key code), 0 = none.
Key=0
; The switch also waits this long (ms) after the last attack button, on top of the attack flag.
QuietMs=300
; Time (ms) the player must be fully idle (attack over, weapon put away) before the swap.
SettleMs=750
